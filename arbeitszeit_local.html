               :`<div class="zb-timer-round-preview">wird gebucht als <strong>${roundedHours} Std.</strong> auf <strong>${esc(activeTimerState.type)}${activeTimerState.ref?' · '+esc(activeTimerState.ref):''}</strong></div>`}
    </div>
    <div class="zb-grid2">
      <div>
        <label class="zb-label">Buchungstyp</label>
        <select class="zb-select" data-action="edit-timer" data-field="type" ${running?'disabled':''}>
          ${typeNames().map(t=>`<option value="${esc(t)}" ${t===activeTimerState.type?'selected':''}>${esc(t)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="zb-label">Betreff</label>
        <input type="text" class="zb-input" value="${esc(activeTimerState.ref||'')}" data-action="edit-timer" data-field="ref" ${running?'disabled':''} placeholder="z. B. Ticket-Nr.">
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${running
        ?`<button class="zb-btn-primary" data-action="stop-timer">${icon('x',15)} Stopp</button>
           <button class="zb-btn-ghost danger" data-action="discard-timer">Abbrechen</button>`
        :`<button class="zb-btn-ghost" data-action="resume-timer">${icon('play',13)} Fortsetzen</button>
           <button class="zb-btn-primary" data-action="save-timer">${icon('check',15)} Speichern</button>
           <button class="zb-btn-ghost danger" data-action="discard-timer">Verwerfen</button>`}
      <button class="zb-btn-ghost" data-action="toggle-focus-mode" title="Fokus-Modus (${formatKeyLabel((shortcuts['focus-mode']&&shortcuts['focus-mode'].key)||'f')})">${icon('focus',13)} Fokus-Modus</button>
    </div>
    <div class="zb-hint" style="margin-top:12px">Wird auf den heutigen Tag (${formatDateDE(todayISO())}) gebucht — genau wie eine manuell hinzugefügte Aufteilung. Läuft auch weiter, wenn du die Seite schliesst und später wieder öffnest. Du kannst beliebig oft stoppen und fortsetzen, bevor du speicherst.</div>
  </section>`;
}
function renderCustomTimersCard(){
  return `<section class="zb-card zb-form-card">
    <div class="zb-form-head"><span>Custom Timer</span></div>
    <div class="zb-hint" style="margin:0 0 14px">Vorlagen aus Buchungstyp und Betreff (z. B. CR · 38523) zum schnellen Starten, ohne jedes Mal neu auszuwählen. Am Griff ⋮⋮ ziehen oder die Pfeile nutzen, um die Reihenfolge zu ändern. Löschen entfernt nur die Vorlage — bereits gebuchte Arbeitszeit bleibt erhalten.</div>
    <div class="zb-split-list">
      ${customTimerPresets.length===0?`<div class="zb-hint" style="margin:0 0 8px">Noch keine Custom Timer angelegt.</div>`:customTimerPresets.map((p,idx)=>`
        <div class="zb-split-edit-row" data-drag-row data-drag-list="customTimers" data-drag-idx="${idx}">
          <span class="zb-drag-handle" draggable="true" data-drag-handle title="Ziehen zum Anordnen">⋮⋮</span>
          <span style="width:10px;height:10px;border-radius:50%;flex:none;background:${typeColor(p.type)}"></span>
          <span style="flex:1 1 160px;font-weight:600">${esc(p.type)}${p.ref?` · ${esc(p.ref)}`:''}</span>
          ${renderListMoveButtons('customTimers',idx,customTimerPresets.length)}
          <button class="zb-btn-ghost sm" data-action="start-preset-timer" data-id="${p.id}" ${activeTimerState?'disabled':''}>${icon('plus',13)} Start</button>
          <button class="zb-iconbtn danger" data-action="delete-preset-timer" data-id="${p.id}" title="Löschen">${icon('trash',13)}</button>
        </div>`).join('')}
    </div>
    <div class="zb-split-add">
      <select id="ct-new-type" class="zb-select">${typeNames().map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select>
      <input id="ct-new-ref" type="text" class="zb-input" placeholder="Betreff (optional)" data-enter-action="add-custom-timer">
      <button class="zb-btn-ghost sm" data-action="add-custom-timer">${icon('plus',13)} Hinzufügen</button>
    </div>
  </section>`;
}
function renderTimer(){
  return renderTimerMainCard()+renderCustomTimersCard();
}
function renderDashboard(){
  if(entries.length===0) return `
    <section class="zb-card zb-empty-big">
      Noch keine Daten vorhanden.
      <div style="margin-top:14px"><button class="zb-btn-primary" data-action="go-erfassen">Ersten Tag erfassen</button></div>
    </section>`;
  return renderDashboardToolbar()
    + (dashboardEditMode?renderWidgetPicker():'')
    + (widgets.length===0
        ? `<section class="zb-card zb-empty-big">Keine Widgets ausgewählt.<div style="margin-top:14px"><button class="zb-btn-primary" data-action="toggle-edit-mode">${icon('plus',15)} Widgets hinzufügen</button></div></section>`
        : `<div class="zb-dash-grid">${widgets.map(w=>renderWidget(w)).join('')}</div>`);
}

function renderApp(){
  const app=document.getElementById('app');
  if(focusMode && activeTimerState){
    app.innerHTML=renderFocusMode();
    return;
  }
  const year=new Date().getFullYear();
  const footerHtml = activeTab==='einstellungen'
    ? `<footer class="zb-footer"><button class="zb-footer-trigger" data-action="toggle-advanced-settings">© ${year} Luca Fröhlich</button></footer>`
    : `<footer class="zb-footer">© ${year} Luca Fröhlich</footer>`;
  app.innerHTML = renderHeader()
    + `<main>${activeTab==='dashboard'?renderDashboard():activeTab==='erfassen'?renderErfassen():activeTab==='timer'?renderTimer():activeTab==='wochen'?renderWochen():renderEinstellungen()}</main>`
    + footerHtml;
}

function init(){
  loadTheme();
  load();
  loadWidgets();
  loadBookingTypes();
  loadActiveTimer();
  loadCustomTimers();
  loadMoneySettings();
  loadShortcuts();
  loadReminders();
  selectedWeek=weekKeyOf(todayISO());
  calendarViewWeek=weekKeyOf(form.date);
  const app=document.getElementById('app');
  app.addEventListener('click', onAppClick);
  app.addEventListener('change', onAppChange);
  app.addEventListener('dragstart', onSettingsDragStart);
  app.addEventListener('dragover', onSettingsDragOver);
  app.addEventListener('drop', onSettingsDrop);
  document.addEventListener('keydown', onGlobalKeyDown);
  renderApp();
  restoreExportDir();
  restoreBackupDir();
  restorePdfDir();
  setInterval(()=>{
    if(activeTimerState && activeTimerState.status==='running'){
      updateTimerDisplay();
      checkTimerDurationReminders();
    }
  },500);
  setInterval(checkDailyReminders,20000);
}
init();
</script>
</body>
</html>
