<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zeiterfassung</title>
<meta name="theme-color" content="#F5F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeiterfassung">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233B5BDB'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='bold'%3EZ%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--border:#E7E9EE;--border-strong:#D1D5DB;
  --text:#14161A;--text-muted:#6B7280;--text-faint:#9CA3AF;
  --accent:#3B5BDB;--accent-soft:#EEF1FC;--accent-dark:#2F46B0;
  --success:#16A34A;--success-soft:#EAF7EF;--warning:#D97706;--warning-soft:#FEF3E2;--danger:#DC2626;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 14px rgba(16,24,40,.06);
  --header-bg:rgba(255,255,255,.85);
  --donut-track:#EEF0F3;
}
:root[data-theme="dark"]{
  --bg:#0F1115;--surface:#1A1D23;--border:#2A2E37;--border-strong:#3D424E;
  --text:#F1F2F4;--text-muted:#9CA3AF;--text-faint:#6B7280;
  --accent:#5B7FEF;--accent-soft:rgba(91,127,239,.18);--accent-dark:#7C97F5;
  --success:#22C55E;--success-soft:rgba(34,197,94,.14);--warning:#F59E0B;--warning-soft:rgba(245,158,11,.14);--danger:#F87171;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 4px 14px rgba(0,0,0,.4);
  --header-bg:rgba(15,17,21,.85);
  --donut-track:#2A2E37;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',ui-sans-serif,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
#app{display:flex;flex-direction:column;min-height:100vh;max-width:1180px;margin:0 auto;}
main{flex:1;padding:26px 28px 48px;}
.zb-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 28px;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
.zb-title{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.01em;}
.zb-nav{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.zb-nav-btn{background:none;border:none;padding:7px 16px;font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;border-radius:8px;transition:all .15s ease;font-family:inherit;white-space:nowrap;}
.zb-nav-btn:hover{color:var(--text);}
.zb-nav-btn.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm);}
.zb-header-right{display:flex;align-items:center;gap:10px;}
.zb-save-status{font-size:12px;color:var(--text-faint);}

@keyframes zb-fade-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes zb-scale-in{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
@keyframes zb-slide-up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes zb-pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(59,91,219,.35);}50%{box-shadow:0 0 0 5px rgba(59,91,219,0);}}
.zb-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease;animation:zb-fade-in .28s ease-out;}
.zb-form-card{padding:24px;margin-bottom:22px;}
.zb-form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:15px;font-weight:700;letter-spacing:-.01em;}
.zb-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
.zb-row-inputs{display:flex;gap:8px;align-items:center;}
.zb-pause{max-width:90px;}
.zb-date-row,.zb-time-row{display:inline-flex;align-items:center;gap:3px;}
.zb-sep{color:var(--text-faint);font-weight:600;}
.zb-select-sm{width:auto;min-width:58px;padding:9px 6px;}
.zb-select-month{width:auto;min-width:92px;padding:9px 6px;}
.zb-cal-strip-wrap{display:flex;align-items:center;gap:8px;}
.zb-cal-strip{display:flex;gap:6px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.zb-cal-day{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1.5px solid var(--border);border-radius:11px;background:var(--surface);cursor:pointer;font-family:inherit;position:relative;transition:all .15s ease;}
.zb-cal-day:hover{border-color:var(--border-strong);}
.zb-cal-day.today{border-color:var(--accent);}
.zb-cal-day.booked{background:var(--bg);}
.zb-cal-day.booked .zb-cal-num{color:var(--text-muted);}
.zb-cal-day.active{background:var(--accent);border-color:var(--accent);box-shadow:0 4px 10px rgba(59,91,219,.25);}
.zb-cal-day.active .zb-cal-wd,.zb-cal-day.active .zb-cal-num{color:#fff;}
.zb-cal-wd{font-size:10px;color:var(--text-faint);text-transform:uppercase;font-weight:700;letter-spacing:.03em;}
.zb-cal-num{font-size:15px;font-weight:700;color:var(--text);}
.zb-cal-dot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent);}
.zb-cal-day.active .zb-cal-dot{background:#fff;}
.zb-time-arrow{color:var(--text-faint);margin:0 4px;}
.zb-time-input{max-width:110px;text-align:center;font-variant-numeric:tabular-nums;}
.zb-field{margin-bottom:18px;}
.zb-label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.zb-input,.zb-select{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13.5px;width:100%;font-family:inherit;color:var(--text);transition:border-color .15s ease,box-shadow .15s ease;}
.zb-input:focus,.zb-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.zb-hours-preview{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap;}
.zb-error{font-size:12.5px;color:var(--danger);font-weight:500;margin-top:10px;}
.zb-hint{font-size:12px;color:var(--text-faint);margin-top:8px;}

.zb-seg{display:flex;flex-wrap:wrap;gap:8px;}
.zb-seg-btn{border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease;font-family:inherit;}
.zb-seg-btn:hover{border-color:var(--border-strong);}

.zb-btn-primary{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s ease;display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 2px rgba(59,91,219,.25);}
.zb-btn-primary:hover{background:var(--accent-dark);box-shadow:0 4px 10px rgba(59,91,219,.3);}
.zb-btn-primary:active,.zb-btn-ghost:active,.zb-iconbtn:active,.zb-seg-btn:active,.zb-key-badge:active,.zb-move-btn:active,.zb-size-btn:active,.zb-toggle-switch:active{transform:scale(.94);}
.zb-btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.zb-btn-primary.sm{padding:8px 14px;font-size:12.5px;}
.zb-btn-ghost{background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s ease;display:inline-flex;align-items:center;gap:7px;}
.zb-btn-ghost:hover{border-color:var(--border-strong);background:var(--bg);}
.zb-btn-ghost.sm{padding:6px 12px;font-size:12px;}
.zb-btn-ghost.danger{border-color:#FCA5A5;color:var(--danger);}
.zb-iconbtn{background:transparent;border:none;cursor:pointer;padding:6px;border-radius:7px;color:var(--text-faint);display:inline-flex;transition:all .15s ease;}
.zb-iconbtn:hover{background:var(--bg);color:var(--text);}
.zb-iconbtn.danger:hover{color:var(--danger);}

.zb-split-list{margin-bottom:10px;}
.zb-split-row{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:var(--bg);border-radius:9px;margin-bottom:6px;font-size:13px;}
.zb-split-row .name{font-weight:600;}
.zb-split-row .val{display:flex;align-items:center;gap:10px;}
.zb-split-edit-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 13px;background:var(--bg);border-radius:9px;margin-bottom:6px;}
.zb-split-edit-row .zb-select{width:auto;flex:1 1 130px;min-width:110px;}
.zb-split-edit-row .zb-input{width:auto;flex:1 1 100px;min-width:90px;}
.zb-split-edit-row .zb-split-hours-input{flex:0 0 70px;min-width:70px;}
.zb-drag-handle{cursor:grab;color:var(--text-faint);font-size:15px;letter-spacing:-2px;padding:2px 4px;flex:none;user-select:none;touch-action:none;}
.zb-drag-handle:active{cursor:grabbing;}
.zb-color-swatch{width:28px;height:28px;border-radius:50%;flex:none;display:inline-block;cursor:pointer;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--border);position:relative;overflow:hidden;}
.zb-color-swatch input[type=color]{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;cursor:pointer;border:none;padding:0;}
.zb-split-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.zb-split-add .zb-select{max-width:220px;}
.zb-split-add .zb-input{max-width:90px;}
.zb-split-summary{margin-top:10px;font-size:12.5px;font-weight:600;}
.zb-split-summary.ok{color:var(--success);}
.zb-split-summary.warn{color:var(--warning);}

.zb-section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:12.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
.zb-table-wrap{overflow-x:auto;}
table.zb-table{border-collapse:collapse;width:100%;}
.zb-table thead tr{background:var(--bg);}
.zb-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
.zb-table td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text);}
.zb-table tr:last-child td{border-bottom:none;}
.zb-table tr:hover td{background:var(--accent-soft);}
.num{font-variant-numeric:tabular-nums;}
.strong{font-weight:700;}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint);}
.accent{color:var(--accent);}
.ellipsis{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap!important;}
.actions{text-align:right;}
.total-label{text-align:right;color:var(--text-muted);font-size:12px;font-weight:700;}
.zb-empty{padding:36px;text-align:center;color:var(--text-faint);font-size:13px;}
.zb-empty-big{padding:48px;text-align:center;color:var(--text-faint);font-size:13px;}
.zb-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:7px;font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap;}
.zb-badge-row{display:flex;flex-wrap:wrap;gap:5px;}

.zb-week-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.zb-week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.zb-week-badge{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 16px;text-align:center;min-width:150px;box-shadow:var(--shadow-sm);}
.zb-week-kw{font-size:13px;font-weight:700;}
.zb-week-range{font-size:11.5px;color:var(--text-faint);}

.zb-chart-empty{height:140px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13px;text-align:center;}
.zb-donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;}
.zb-donut{position:relative;flex:none;}
.zb-donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.zb-donut-total{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.02em;}
.zb-donut-unit{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
.zb-legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:160px;}
.zb-legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
.zb-legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.zb-legend-name{flex:1;font-weight:500;color:var(--text);}
.zb-legend-val{color:var(--text-muted);font-weight:600;white-space:nowrap;}
.zb-trend-bars{display:flex;align-items:flex-end;gap:10px;padding-top:6px;}
.zb-trend-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.zb-trend-bar{width:100%;max-width:34px;background:linear-gradient(180deg,var(--accent),var(--accent-dark));border-radius:7px 7px 2px 2px;min-height:4px;transition:opacity .15s ease;}
.zb-trend-bar:hover{opacity:.75;}
.zb-trend-val{font-size:11px;color:var(--text-muted);font-weight:700;}
.zb-trend-label{font-size:10.5px;color:var(--text-faint);}
.zb-loading{height:60vh;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13px;}
.zb-folder-card{padding:14px 18px;margin-bottom:18px;}
.zb-folder-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.zb-folder-sep{height:1px;background:var(--border);margin:14px 0;}
.zb-folder-info{display:flex;flex-direction:column;gap:3px;min-width:0;}
.zb-folder-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
.zb-folder-path{font-size:12.5px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;}
.zb-folder-path.unset{color:var(--text-faint);font-weight:500;}
.zb-folder-actions{display:flex;gap:8px;flex-wrap:wrap;}
.zb-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);z-index:50;max-width:90vw;text-align:center;animation:zb-toast-in .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes zb-toast-in{from{opacity:0;transform:translateX(-50%) translateY(12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.zb-timer-display{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--accent);}
.zb-timer-money{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--success);margin-top:8px;}
.zb-timer-money::before{content:'+ ';}
.zb-footer{padding:10px 28px 26px;text-align:center;font-size:11px;color:var(--text-faint);}
.zb-footer-trigger{background:none;border:none;color:inherit;font:inherit;cursor:default;padding:4px 10px;margin:0;}
.zb-toggle-switch{width:42px;height:24px;border-radius:999px;background:var(--border-strong);border:none;cursor:pointer;position:relative;padding:0;flex:none;transition:background .2s ease;}
.zb-toggle-switch.on{background:var(--accent);}
.zb-toggle-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 3px rgba(0,0,0,.3);}
.zb-toggle-switch.on .zb-toggle-knob{left:20px;}
.zb-toggle-switch.sm{width:34px;height:20px;}
.zb-toggle-switch.sm .zb-toggle-knob{width:16px;height:16px;top:2px;left:2px;}
.zb-toggle-switch.sm.on .zb-toggle-knob{left:16px;}
.zb-reminder-list{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
.zb-reminder-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg);animation:zb-fade-in .25s ease-out;}
.zb-reminder-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--border);}
.zb-reminder-title{flex:1;font-size:12.5px;font-weight:700;color:var(--text);}
.zb-reminder-body{padding:14px;display:flex;flex-direction:column;gap:11px;}
.zb-reminder-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);font-weight:600;}
.zb-reminder-row .zb-input,.zb-reminder-row .zb-select{width:auto;flex:1 1 140px;min-width:110px;}
.zb-reminder-row .zb-label{flex:0 0 78px;text-transform:none;letter-spacing:0;font-size:12px;color:var(--text-muted);}
.zb-weekday-picker{display:flex;gap:4px;flex-wrap:wrap;}
.zb-weekday-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s ease;}
.zb-weekday-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.zb-settings-section-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 4px;background:none;border:none;border-bottom:1px solid var(--border);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;text-align:left;margin-top:18px;margin-bottom:14px;}
.zb-settings-section-head:first-child{margin-top:0;}
.zb-settings-chevron{color:var(--text-faint);transition:transform .25s cubic-bezier(.34,1.56,.64,1);display:inline-flex;}
.zb-settings-chevron.open{transform:rotate(90deg);}
.zb-key-badge{background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit;min-width:64px;text-align:center;}
.zb-key-badge:hover{border-color:var(--border-strong);}
.zb-key-badge.recording{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);animation:zb-pulse-ring 1.1s ease-in-out infinite;}
.zb-focus-mode{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:24px;animation:zb-fade-in .3s ease-out;}
.zb-focus-exit{position:absolute;top:22px;right:22px;background:none;border:none;color:var(--text-faint);cursor:pointer;padding:10px;border-radius:9px;}
.zb-focus-exit:hover{background:var(--surface);color:var(--text);}
.zb-focus-label{font-size:14px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:18px;}
.zb-focus-time{font-size:min(18vw,110px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--accent);line-height:1;animation:zb-scale-in .4s cubic-bezier(.34,1.56,.64,1);}
.zb-focus-money{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--success);margin-top:16px;}
.zb-focus-money::before{content:'+ ';}
.zb-focus-actions{display:flex;gap:12px;margin-top:36px;}
.zb-btn-primary.lg,.zb-btn-ghost.lg{padding:14px 26px;font-size:15px;}
.zb-timer-round-preview{margin-top:8px;font-size:13px;color:var(--text-muted);font-weight:600;}
.zb-timer-round-preview strong{color:var(--accent);}

/* ---------- Dashboard: individuelle Widgets ---------- */
.zb-dash-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.zb-dash-hint{font-size:12.5px;color:var(--text-muted);}
.zb-dash-toolbar-actions{display:flex;gap:8px;}
.zb-widget-picker{padding:18px 20px;margin-bottom:18px;}
.zb-widget-picker-head{font-size:13.5px;font-weight:700;margin-bottom:4px;}
.zb-widget-picker-sub{font-size:12px;color:var(--text-faint);margin-bottom:14px;}
.zb-wp-cat{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px;}
.zb-wp-cat:first-of-type{margin-top:0;}
.zb-wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.zb-wp-item{text-align:left;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;font-family:inherit;transition:all .15s ease;display:flex;flex-direction:column;gap:4px;}
.zb-wp-item:hover{border-color:var(--accent);background:var(--accent-soft);}
.zb-wp-name{font-size:12.5px;font-weight:700;color:var(--text);}
.zb-wp-desc{font-size:11px;color:var(--text-faint);line-height:1.4;}
.zb-dash-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:row dense;gap:16px;align-items:stretch;}
.zb-widget{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;animation:zb-fade-in .3s ease-out;}
.zb-widget.wsize-s{grid-column:span 1;}
.zb-widget.wsize-m{grid-column:span 2;}
.zb-widget.wsize-l{grid-column:span 4;}
.zb-widget-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--bg);}
.zb-widget-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
.zb-widget-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.zb-widget-body{padding:18px;flex:1;display:flex;flex-direction:column;}
.zb-widget-editsettings{display:flex;gap:16px;flex-wrap:wrap;padding:9px 14px;background:var(--accent-soft);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-muted);font-weight:600;}
.zb-widget-editsettings label{display:flex;align-items:center;gap:6px;}

.zb-mini-select{width:auto;padding:5px 7px;font-size:11px;border-radius:7px;}
.zb-size-group{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:2px;}
.zb-size-btn{border:none;background:none;font-size:10px;font-weight:700;color:var(--text-faint);padding:4px 7px;border-radius:5px;cursor:pointer;font-family:inherit;}
.zb-size-btn.active{background:var(--accent);color:#fff;}
.zb-move-group{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:2px;}
.zb-move-group.sm{flex:none;background:var(--bg);}
.zb-move-btn{border:none;background:none;color:var(--text-muted);padding:4px 6px;border-radius:5px;cursor:pointer;display:inline-flex;font-family:inherit;}
.zb-move-btn:hover:not(:disabled){background:var(--bg);color:var(--text);}
.zb-move-btn:disabled{opacity:.3;cursor:not-allowed;}
.zb-kpi-body{--kpi-c:var(--accent);flex:1;display:flex;flex-direction:column;justify-content:center;}
.zb-kpi-value{font-size:26px;font-weight:800;color:var(--kpi-c);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.zb-kpi-sub{font-size:11.5px;color:var(--text-faint);margin-top:7px;line-height:1.4;}
.zb-kpi-trend{margin-top:14px;}
.zb-inline-setting{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-muted);font-weight:600;}
.zb-mini-input{width:74px;padding:6px 8px;font-size:12.5px;}
.zb-gauge-wrap{position:relative;width:180px;max-width:100%;margin:0 auto;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;}
.zb-gauge-value{position:absolute;top:44px;left:0;right:0;font-size:25px;font-weight:800;letter-spacing:-.02em;}
.zb-gauge-sub{margin-top:10px;font-size:12.5px;color:var(--text-muted);font-weight:700;}
.zb-gauge-sub2{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.zb-gauge-foot{display:flex;justify-content:center;}
.zb-leaderboard{display:flex;flex-direction:column;gap:11px;}
.zb-lb-row{display:flex;align-items:center;gap:10px;font-size:13px;}
.zb-lb-rank{width:24px;text-align:center;font-weight:700;flex:none;font-size:13px;}

.zb-lb-bar-track{flex:1;height:8px;background:var(--donut-track);border-radius:999px;overflow:hidden;}

.zb-hm-l0{background:var(--donut-track);}

<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const STORAGE_KEY='zb-day-data-v1';
const DEFAULT_LOCATION_SEED=[
  {name:'Chur',color:'#3B5BDB'},{name:'Zürich',color:'#0EA5A5'},{name:'St. Gallen',color:'#7C5CFC'},{name:'Bern',color:'#D97706'},{name:'Homeoffice',color:'#64748B'}
];
let LOCATIONS_DATA=[];
function loadLocations(){
  try{
    const raw=localStorage.getItem('zb-locations-v1');
    if(raw){ const parsed=JSON.parse(raw); if(Array.isArray(parsed)&&parsed.length){ LOCATIONS_DATA=parsed; return; } }
  }catch(e){}
  LOCATIONS_DATA=DEFAULT_LOCATION_SEED.map(l=>({...l}));
}
function saveLocations(){ try{ localStorage.setItem('zb-locations-v1', JSON.stringify(LOCATIONS_DATA)); }catch(e){} }
function locationNames(){ return LOCATIONS_DATA.map(l=>l.name); }
function locationColor(name){ const l=LOCATIONS_DATA.find(x=>x.name===name); return l?l.color:'#64748B'; }
function locationColorMap(){ const m={}; LOCATIONS_DATA.forEach(l=>{m[l.name]=l.color;}); return m; }
function nextPaletteColorFor(list){
  const used=new Set(list.map(x=>x.color));
  return TYPE_COLOR_PALETTE.find(c=>!used.has(c)) || TYPE_COLOR_PALETTE[list.length % TYPE_COLOR_PALETTE.length];
}
function addLocation(){
  const inp=document.getElementById('new-location-name');if(!inp) return;
  const name=inp.value.trim();if(!name) return;
  if(LOCATIONS_DATA.some(l=>l.name===name)){ alert('Dieser Standort existiert bereits.'); return; }
  LOCATIONS_DATA.push({name,color:nextPaletteColorFor(LOCATIONS_DATA)});
  saveLocations();renderApp();
}
function renameLocation(index,newName){
  newName=(newName||'').trim();
  const l=LOCATIONS_DATA[index];if(!l) return;
  if(!newName || LOCATIONS_DATA.some((x,i)=>i!==index && x.name===newName)){ renderApp(); return; }
  l.name=newName;
  saveLocations();renderApp();
}
function deleteLocation(index){
  const l=LOCATIONS_DATA[index];if(!l) return;
  if(!confirm(`Standort "${l.name}" wirklich löschen? Bereits erfasste Einträge mit diesem Standort bleiben unverändert erhalten — er steht nur bei neuen Einträgen nicht mehr zur Auswahl.`)) return;
  LOCATIONS_DATA.splice(index,1);
  saveLocations();renderApp();
}
function setLocationColor(index,color){
  const l=LOCATIONS_DATA[index];if(!l) return;
  l.color=color;saveLocations();renderApp();
}
const DEFAULT_TYPE_SEED=[
  {name:'Militär',color:'#475569'},{name:'Ferien',color:'#16A34A'},{name:'Kompens',color:'#0EA5A5'},
  {name:'Krank',color:'#DC2626'},{name:'OPS',color:'#3B5BDB'},{name:'LER',color:'#7C5CFC'},
  {name:'CR',color:'#D97706'},{name:'IC',color:'#DB2777'},{name:'SR',color:'#0284C7'}
];
const TYPE_COLOR_PALETTE=['#475569','#16A34A','#0EA5A5','#DC2626','#3B5BDB','#7C5CFC','#D97706','#DB2777','#0284C7','#059669','#9333EA','#EA580C','#65A30D','#0891B2'];
let BOOKING_TYPES=[];
function loadBookingTypes(){
  try{
    const raw=localStorage.getItem('zb-booking-types-v1');
    if(raw){
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length){ BOOKING_TYPES=parsed; return; }
    }
  }catch(e){}
  BOOKING_TYPES=DEFAULT_TYPE_SEED.map(t=>({...t}));
}
function saveBookingTypes(){
  try{ localStorage.setItem('zb-booking-types-v1', JSON.stringify(BOOKING_TYPES)); }catch(e){}
}
function bookingTypeNextColor(){ return nextPaletteColorFor(BOOKING_TYPES); }
function typeNames(){ return BOOKING_TYPES.map(t=>t.name); }
function typeColor(name){ const t=BOOKING_TYPES.find(x=>x.name===name); return t?t.color:'#64748B'; }
function typeColorMap(){ const m={}; BOOKING_TYPES.forEach(t=>{m[t.name]=t.color;}); return m; }
function addBookingType(){
  const inp=document.getElementById('new-type-name');if(!inp) return;
  const name=inp.value.trim();if(!name) return;
  if(BOOKING_TYPES.some(t=>t.name===name)){ alert('Dieser Buchungstyp existiert bereits.'); return; }
  BOOKING_TYPES.push({name,color:bookingTypeNextColor()});
  saveBookingTypes();renderApp();
}
function renameBookingType(index,newName){
  newName=(newName||'').trim();
  const t=BOOKING_TYPES[index];if(!t) return;
  if(!newName || BOOKING_TYPES.some((x,i)=>i!==index && x.name===newName)){ renderApp(); return; }
  t.name=newName;
  saveBookingTypes();renderApp();
}
function deleteBookingType(index){
  const t=BOOKING_TYPES[index];if(!t) return;
  if(!confirm(`Buchungstyp "${t.name}" wirklich löschen? Bereits erfasste Einträge mit diesem Typ bleiben unverändert erhalten und werden weiterhin korrekt angezeigt — er steht nur bei neuen Einträgen nicht mehr zur Auswahl.`)) return;
  BOOKING_TYPES.splice(index,1);
  saveBookingTypes();renderApp();
}
function setBookingTypeColor(index,color){
  const t=BOOKING_TYPES[index];if(!t) return;
  t.color=color;saveBookingTypes();renderApp();
}

let entries=[];
let activeTab='dashboard';
let editingId=null;
let formError='';
function defaultForm(){return {date:todayISO(),location:'',arrival:'08:00',departure:'17:00',pause:60,remark:'',splits:[]};}
let form=defaultForm();
let selectedWeek;
let calendarViewWeek;
let theme='light';
let exportDirHandle=null;
let exportDirName='';
let backupDirHandle=null;
let backupDirName='';
let pdfDirHandle=null;
let pdfDirName='';
let activeTimerState=null;
let customTimerPresets=[];
let moneyTrackingEnabled=false;
let hourlyWage=0;
let advancedSettingsRevealed=false;
let toastTimer=null;
let focusMode=false;
let shortcuts={};
let recordingShortcutId=null;
let reminders=[];
let settingsExpandedSections=new Set(['ordner']);

/* Dashboard-Widget-Zustand */
let widgets=[];
let dashboardEditMode=false;

function loadTheme(){
  try{ const t=localStorage.getItem('zb-theme'); if(t==='dark'||t==='light') theme=t; }catch(e){}
  document.documentElement.setAttribute('data-theme',theme);
}
function toggleTheme(){
  theme=theme==='dark'?'light':'dark';
  try{ localStorage.setItem('zb-theme',theme); }catch(e){}
  document.documentElement.setAttribute('data-theme',theme);
  renderApp();
}

function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      entries=parsed.entries||[];
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({entries})); }catch(e){}
}
function showToast(msg,ms){
  ms=ms||3200;
  let el=document.getElementById('zb-toast');
  if(!el){
    el=document.createElement('div');
    el.id='zb-toast';el.className='zb-toast';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  el.style.display='block';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.style.display='none';},ms);
}

/* ---------- Erinnerungen ---------- */
function loadReminders(){
  try{
    const raw=localStorage.getItem('zb-reminders-v1');
    if(raw){ const parsed=JSON.parse(raw); if(Array.isArray(parsed)) reminders=parsed; }
  }catch(e){}
  reminders=reminders.filter(r=>r && typeof r==='object' && (r.type==='daily'||r.type==='timer-duration'));
  reminders.forEach(r=>{
    if(typeof r.enabled!=='boolean') r.enabled=true;
    if(typeof r.title!=='string') r.title='';
    if(typeof r.message!=='string') r.message='';
    if(typeof r.sound!=='boolean') r.sound=false;
    if(r.type==='daily'){
      if(typeof r.time!=='string') r.time='18:00';
      if(!Array.isArray(r.weekdays)) r.weekdays=[0,1,2,3,4,5,6];
      if(r.condition!=='hours-below') r.condition='no-entry';
      if(typeof r.hoursThreshold!=='number' || isNaN(r.hoursThreshold)) r.hoursThreshold=4;
    }else{
      if(typeof r.minutes!=='number' || isNaN(r.minutes) || r.minutes<1) r.minutes=30;
      if(typeof r.repeat!=='boolean') r.repeat=false;
    }
  });
}
function saveReminders(){
  try{ localStorage.setItem('zb-reminders-v1', JSON.stringify(reminders)); }catch(e){}
}
function addReminder(type){
  const r = type==='daily'
    ? {id:genId(),type:'daily',enabled:true,time:'18:00',lastFiredDate:null,weekdays:[0,1,2,3,4,5,6],condition:'no-entry',hoursThreshold:4,title:'',message:'',sound:false}
    : {id:genId(),type:'timer-duration',enabled:true,minutes:30,repeat:false,title:'',message:'',sound:false};
  reminders.push(r);
  saveReminders();renderApp();
}
function deleteReminder(id){
  reminders=reminders.filter(r=>r.id!==id);
  saveReminders();renderApp();
}
function toggleReminder(id){
  const r=reminders.find(x=>x.id===id);if(!r) return;
  r.enabled=!r.enabled;
  saveReminders();renderApp();
}
function toggleReminderSound(id){
  const r=reminders.find(x=>x.id===id);if(!r) return;
  r.sound=!r.sound;
  saveReminders();renderApp();
}
function toggleReminderRepeat(id){
  const r=reminders.find(x=>x.id===id);if(!r) return;
  r.repeat=!r.repeat;
  saveReminders();renderApp();
}
function toggleReminderWeekday(id,dow){
  const r=reminders.find(x=>x.id===id);if(!r) return;
  if(!r.weekdays) r.weekdays=[0,1,2,3,4,5,6];
  const idx=r.weekdays.indexOf(dow);
  if(idx>=0) r.weekdays.splice(idx,1); else r.weekdays.push(dow);
  saveReminders();renderApp();
}
function setReminderField(id,field,value){
  const r=reminders.find(x=>x.id===id);if(!r) return;
  if(field==='minutes') r.minutes=Math.max(1,Number(value)||1);
  else if(field==='hoursThreshold') r.hoursThreshold=Math.max(0,Number(value)||0);
  else r[field]=value;
  saveReminders();renderApp();
}
function requestNotificationPermission(){
  if(!('Notification' in window)){ showToast('Dieser Browser unterstützt keine Benachrichtigungen.'); return; }
  if(Notification.permission==='default'){
    Notification.requestPermission().then(p=>{
      showToast(p==='granted'?'Benachrichtigungen erlaubt.':'Benachrichtigungen wurden nicht erlaubt.');
    });
  }else if(Notification.permission==='granted'){
    showToast('Benachrichtigungen sind bereits erlaubt.');
  }else{
    showToast('Benachrichtigungen sind im Browser blockiert. Bitte in den Browser-Einstellungen erlauben.');
  }
}
function showReminderNotification(title,body){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification(title,{body});
      return;
    }
  }catch(e){}
  showToast(title+': '+body, 6000);
}
function playReminderSound(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    const ctx=new Ctx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=880;
    gain.gain.setValueAtTime(0.15,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
    osc.start();osc.stop(ctx.currentTime+0.4);
  }catch(e){}
}
function checkDailyReminders(){
  const now=new Date();
  const nowHM=pad2(now.getHours())+':'+pad2(now.getMinutes());
  const todayIso=todayISO();
  const dow=(now.getDay()+6)%7;
  let changed=false;
  reminders.forEach(r=>{
    if(!r.enabled || r.type!=='daily') return;
    if(r.weekdays && r.weekdays.length && !r.weekdays.includes(dow)) return;
    if(r.time===nowHM && r.lastFiredDate!==todayIso){
      let shouldFire=false, body='';
      if(r.condition==='hours-below'){
        const totalToday=round2(entries.filter(e=>e.date===todayIso).reduce((s,e)=>s+e.hours,0));
        const threshold=Number(r.hoursThreshold)||0;
        if(totalToday<threshold){ shouldFire=true; body=r.message||`Bisher nur ${totalToday} von ${threshold} Std. erfasst.`; }
      }else{
        const hasEntry=entries.some(e=>e.date===todayIso);
        if(!hasEntry){ shouldFire=true; body=r.message||'Für heute wurde noch kein Eintrag erfasst.'; }
      }
      if(shouldFire){
        showReminderNotification(r.title||'Zeiterfassung',body);
        if(r.sound) playReminderSound();
      }
      r.lastFiredDate=todayIso;
      changed=true;
    }
  });
  if(changed) saveReminders();
}
function checkTimerDurationReminders(){
  if(!activeTimerState || activeTimerState.status!=='running') return;
  const elapsedMin=Math.floor(getElapsedMs(activeTimerState)/60000);
  if(!activeTimerState.firedReminderMinutes) activeTimerState.firedReminderMinutes=[];
  let changed=false;
  reminders.filter(r=>r.enabled && r.type==='timer-duration').forEach(r=>{
    const mins=Math.max(1,Number(r.minutes)||30);
    if(r.repeat){
      const marksPassed=Math.floor(elapsedMin/mins);
      for(let m=1;m<=marksPassed;m++){
        const key=r.id+':'+(m*mins);
        if(!activeTimerState.firedReminderMinutes.includes(key)){
          activeTimerState.firedReminderMinutes.push(key);
          changed=true;
          showReminderNotification(r.title||('Timer läuft seit '+(m*mins)+' Minuten'), r.message||((activeTimerState.type||'')+(activeTimerState.ref?' · '+activeTimerState.ref:'')));
          if(r.sound) playReminderSound();
        }
      }
    }else{
      const key=r.id+':once';
      if(elapsedMin>=mins && !activeTimerState.firedReminderMinutes.includes(key)){
        activeTimerState.firedReminderMinutes.push(key);
        changed=true;
        showReminderNotification(r.title||('Timer läuft seit '+mins+' Minuten'), r.message||((activeTimerState.type||'')+(activeTimerState.ref?' · '+activeTimerState.ref:'')));
        if(r.sound) playReminderSound();
      }
    }
  });
  if(changed) saveActiveTimerState();
}

/* ---------- Timer ---------- */
function loadActiveTimer(){
  try{
    const raw=localStorage.getItem('zb-active-timer-v1');
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed && typeof parsed==='object' && typeof parsed.type==='string' && (parsed.status==='running'||parsed.status==='stopped')){
        if(typeof parsed.accumulatedMs!=='number' || isNaN(parsed.accumulatedMs)) parsed.accumulatedMs=0;
        if(typeof parsed.firstStartedAt!=='number' || isNaN(parsed.firstStartedAt)) parsed.firstStartedAt=typeof parsed.startedAt==='number'?parsed.startedAt:Date.now();
        if(parsed.status==='running' && (typeof parsed.startedAt!=='number' || isNaN(parsed.startedAt))) parsed.startedAt=Date.now();
        if(parsed.status==='stopped') parsed.startedAt=null;
        if(typeof parsed.ref!=='string') parsed.ref='';
        activeTimerState=parsed;
      }else{
        try{ localStorage.removeItem('zb-active-timer-v1'); }catch(e2){}
      }
    }
  }catch(e){
    try{ localStorage.removeItem('zb-active-timer-v1'); }catch(e2){}
  }
}
function saveActiveTimerState(){
  try{
    if(activeTimerState) localStorage.setItem('zb-active-timer-v1', JSON.stringify(activeTimerState));
    else localStorage.removeItem('zb-active-timer-v1');
  }catch(e){}
}

function getElapsedMs(t){
  if(!t) return 0;
  const runningPart=(t.status==='running' && t.startedAt)?(Date.now()-t.startedAt):0;
  return Math.max(0,(t.accumulatedMs||0)+runningPart);
}
function formatElapsed(ms){
  const totalSec=Math.floor(ms/1000);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  return pad2(h)+':'+pad2(m)+':'+pad2(s);
}
function updateTimerDisplay(){
  const el=document.getElementById('timer-elapsed-display');
  if(el && activeTimerState) el.textContent=formatElapsed(getElapsedMs(activeTimerState));
  if(moneyTrackingEnabled && hourlyWage>0 && activeTimerState){
    const moneyEl=document.getElementById('timer-money-display');
    if(moneyEl){
      const earnings=(getElapsedMs(activeTimerState)/3600000)*hourlyWage;
      moneyEl.textContent=earnings.toFixed(2);
    }
  }
}
function startTimer(type,ref){
  if(activeTimerState){ alert('Es läuft bereits ein Timer. Bitte zuerst stoppen und speichern oder verwerfen.'); return; }
  if(!type){ alert('Bitte einen Buchungstyp auswählen.'); return; }
  const now=Date.now();
  activeTimerState={type,ref:(ref||'').trim(),status:'running',accumulatedMs:0,startedAt:now,firstStartedAt:now};
  saveActiveTimerState();
  renderApp();
}
function stopTimer(){
  if(!activeTimerState || activeTimerState.status!=='running') return;
  activeTimerState.accumulatedMs=(activeTimerState.accumulatedMs||0)+Math.max(0,Date.now()-activeTimerState.startedAt);
  activeTimerState.startedAt=null;
  activeTimerState.status='stopped';
  saveActiveTimerState();
  renderApp();
}
function resumeTimer(){
  if(!activeTimerState || activeTimerState.status!=='stopped') return;
  activeTimerState.status='running';
  activeTimerState.startedAt=Date.now();
  saveActiveTimerState();
  renderApp();
}
function clearActiveTimer(){
  activeTimerState=null;
  saveActiveTimerState();
}
function discardTimer(){
  if(activeTimerState){
    const elapsedSec=Math.floor(getElapsedMs(activeTimerState)/1000);
    if(elapsedSec>60 && !confirm('Timer wirklich verwerfen? Die bisher erfasste Zeit ('+formatElapsed(getElapsedMs(activeTimerState))+') geht dabei verloren.')) return;
  }
  clearActiveTimer();
  renderApp();
}
function editActiveTimerField(field,value){
  if(!activeTimerState || activeTimerState.status!=='stopped') return;
  activeTimerState[field]=field==='ref'?value.trim():value;
  saveActiveTimerState();
  renderApp();
}
function saveTimerToToday(){
  if(!activeTimerState || activeTimerState.status!=='stopped') return;
  const elapsedMs=getElapsedMs(activeTimerState);
  const hours=Math.round((elapsedMs/3600000)*10)/10;
  const type=activeTimerState.type, ref=activeTimerState.ref;
  if(hours<=0){
    if(confirm('Die erfasste Zeit ist praktisch 0 Std. Timer trotzdem verwerfen?')) discardTimer();
    return;
  }
  const todayIso=todayISO();
  let entry=entries.find(e=>e.date===todayIso);
  const wasNewDay=!entry;
  if(!entry){
    const startD=new Date(activeTimerState.firstStartedAt);
    const nowD=new Date();
    entry={
      id:genId(),date:todayIso,
      location: entries.length?entries[entries.length-1].location:(locationNames()[0]||''),
      arrival: pad2(startD.getHours())+':'+pad2(startD.getMinutes()),
      departure: pad2(nowD.getHours())+':'+pad2(nowD.getMinutes()),
      pause:0,remark:'',hours,splits:[]
    };
    entries.push(entry);
  }
  entry.splits.push({id:genId(),type,ref,hours,origin:'timer'});
  save();
  clearActiveTimer();
  showToast(hours+' h auf "'+type+(ref?' · '+ref:'')+'" gebucht ('+formatDateDE(todayIso)+').');
  if(wasNewDay && backupDirHandle){ exportBackup(); }
  if(isLastDayOfMonth(todayIso)){ const d=toDate(todayIso); generateMonthlyPdfReport(d.getFullYear(),d.getMonth()); }
  renderApp();
}
function addCustomTimerPreset(){
  const typeEl=document.getElementById('ct-new-type');
  const refEl=document.getElementById('ct-new-ref');
  const type=typeEl?typeEl.value:'';
  const ref=refEl?refEl.value.trim():'';

function deleteCustomTimerPreset(id){
  customTimerPresets=customTimerPresets.filter(p=>p.id!==id);

}
function startPresetTimer(id){
  const p=customTimerPresets.find(x=>x.id===id);
  if(p) startTimer(p.type,p.ref);
}

/* ---------- Zielordner: IndexedDB-Speicher für den FileSystemDirectoryHandle ---------- */
const IDB_NAME='zb-fs-handles';
const IDB_STORE='handles';
const IDB_KEY_EXPORT='exportDir';
const IDB_KEY_BACKUP='backupDir';
const IDB_KEY_PDF='pdfDir';
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{req.result.createObjectStore(IDB_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).get(key);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}
function fsApiSupported(){
  return typeof window.showDirectoryPicker==='function';
}
async function verifyDirPermission(handle,requestIfNeeded){
  if(!handle) return false;
  const opts={mode:'readwrite'};
  try{
    if((await handle.queryPermission(opts))==='granted') return true;
    if(requestIfNeeded && (await handle.requestPermission(opts))==='granted') return true;
  }catch(e){}
  return false;
}
async function restoreExportDir(){
  if(!fsApiSupported()) return;

}

const WEEKDAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const WEEKDAYS_SHORT=['Mo','Di','Mi','Do','Fr','Sa','So'];
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function pad2(n){return String(n).padStart(2,'0');}

/* ---------- Tastenkombinationen ---------- */
const SHORTCUT_DEFS=[
  {id:'toggle-timer',label:'Timer starten / stoppen',defaultKey:'space'},
  {id:'goto-dashboard',label:'Zu Dashboard wechseln',defaultKey:'1'},
  {id:'goto-erfassen',label:'Zu Erfassen wechseln',defaultKey:'2'},
  {id:'goto-timer',label:'Zu Timer wechseln',defaultKey:'3'},
  {id:'goto-wochen',label:'Zu Wochen wechseln',defaultKey:'4'},
  {id:'goto-einstellungen',label:'Zu Einstellungen wechseln',defaultKey:'5'},
  {id:'toggle-theme',label:'Darkmode umschalten',defaultKey:'d'},
  {id:'focus-mode',label:'Fokus-Modus umschalten',defaultKey:'f'},
  {id:'save-entry',label:'Eintrag speichern (in Erfassen)',defaultKey:'ctrl+s'},
  {id:'quick-backup',label:'Backup jetzt erstellen',defaultKey:'ctrl+b'},
  {id:'new-entry',label:'Neuer Eintrag (Formular leeren)',defaultKey:'ctrl+e'},
  {id:'week-prev',label:'Vorherige Woche (in Wochen)',defaultKey:'ctrl+arrowleft'},
  {id:'week-next',label:'Nächste Woche (in Wochen)',defaultKey:'ctrl+arrowright'},

function loadShortcuts(){
  try{
    const raw=localStorage.getItem('zb-shortcuts-v2');
    if(raw) shortcuts=JSON.parse(raw);
  }catch(e){}
  if(!shortcuts || typeof shortcuts!=='object') shortcuts={};
  if(Object.keys(shortcuts).length===0){
    try{
      const rawOld=localStorage.getItem('zb-shortcuts-v1');
      if(rawOld){
        const old=JSON.parse(rawOld);
        Object.keys(old).forEach(id=>{ shortcuts[id]={key:old[id]===' '?'space':old[id],enabled:true}; });
      }
    }catch(e){}
  }
  Object.keys(shortcuts).forEach(id=>{
    if(typeof shortcuts[id]==='string'){
      shortcuts[id]={key:shortcuts[id]===' '?'space':shortcuts[id],enabled:true};
    }else if(!shortcuts[id] || typeof shortcuts[id]!=='object' || typeof shortcuts[id].key!=='string'){
      delete shortcuts[id];
    }
  });
  SHORTCUT_DEFS.forEach(s=>{ if(!(s.id in shortcuts)) shortcuts[s.id]={key:s.defaultKey,enabled:true}; });
}
function saveShortcuts(){
  try{ localStorage.setItem('zb-shortcuts-v2', JSON.stringify(shortcuts)); }catch(e){}
}
function resetShortcuts(){
  if(!confirm('Alle Tastenkombinationen auf die Standardbelegung zurücksetzen (inkl. Ein/Aus-Status)?')) return;
  shortcuts={};
  SHORTCUT_DEFS.forEach(s=>{ shortcuts[s.id]={key:s.defaultKey,enabled:true}; });
  saveShortcuts();
  renderApp();
}
function toggleShortcutEnabled(id){
  if(!shortcuts[id]) return;
  shortcuts[id].enabled=!shortcuts[id].enabled;
  saveShortcuts();
  renderApp();
}
const ARROW_LABELS={arrowleft:'←',arrowright:'→',arrowup:'↑',arrowdown:'↓'};
function formatKeyLabel(key){
  if(!key) return '–';
  const parts=key.split('+');
  const main=parts.pop();
  const modLabels=parts.map(p=>p==='ctrl'?'Ctrl':p==='alt'?'Alt':p==='shift'?'Shift':p==='meta'?'⌘':p);
  let mainLabel = main==='space'?'Leertaste':main==='escape'?'Esc':ARROW_LABELS[main]?ARROW_LABELS[main]:main.length===1?main.toUpperCase():main;
  return [...modLabels,mainLabel].join('+');
}
function startRecordingShortcut(id){
  recordingShortcutId=id;
  renderApp();
}
const MODIFIER_ONLY_KEYS=['Control','Alt','Shift','Meta','OS','ContextMenu'];
function normalizeKey(e){
  const parts=[];
  if(e.ctrlKey) parts.push('ctrl');
  if(e.altKey) parts.push('alt');
  if(e.shiftKey) parts.push('shift');
  if(e.metaKey) parts.push('meta');
  let k=e.key;
  if(k===' ') k='space';
  k=k.toLowerCase();
  parts.push(k);
  return parts.join('+');
}
function captureShortcutKey(e){
  if(MODIFIER_ONLY_KEYS.includes(e.key)) return;
  e.preventDefault();
  if(e.key==='Escape' && !e.ctrlKey && !e.altKey && !e.metaKey){ recordingShortcutId=null; renderApp(); return; }
  if(!shortcuts[recordingShortcutId]) shortcuts[recordingShortcutId]={key:'',enabled:true};
  shortcuts[recordingShortcutId].key=normalizeKey(e);
  saveShortcuts();
  recordingShortcutId=null;
  renderApp();
}
function runShortcut(id){
  if(id==='goto-dashboard'){ activeTab='dashboard'; renderApp(); }
  else if(id==='goto-erfassen'){ activeTab='erfassen'; renderApp(); }
  else if(id==='goto-timer'){ activeTab='timer'; renderApp(); }
  else if(id==='goto-wochen'){ activeTab='wochen'; renderApp(); }
  else if(id==='goto-einstellungen'){ activeTab='einstellungen'; renderApp(); }
  else if(id==='toggle-theme'){ toggleTheme(); }
  else if(id==='focus-mode'){ toggleFocusMode(); }
  else if(id==='toggle-timer'){
    if(activeTimerState){
      if(activeTimerState.status==='running') stopTimer(); else resumeTimer();
    }else if(activeTab==='timer'){
      const t=document.getElementById('timer-type');
      const r=document.getElementById('timer-ref');
      if(t) startTimer(t.value, r?r.value:'');
    }
  }
  else if(id==='save-entry'){ if(activeTab==='erfassen') submitErfassenForm(); }
  else if(id==='quick-backup'){ exportBackup(); }
  else if(id==='new-entry'){ activeTab='erfassen'; resetForm(); renderApp(); }
  else if(id==='week-prev'){ if(activeTab==='wochen'){ selectedWeek=shiftWeekKey(selectedWeek,-1); renderApp(); } }
  else if(id==='week-next'){ if(activeTab==='wochen'){ selectedWeek=shiftWeekKey(selectedWeek,1); renderApp(); } }
  else if(id==='toggle-dashboard-edit'){ dashboardEditMode=!dashboardEditMode; renderApp(); }
  else if(id==='generate-pdf-report'){ const d=new Date(); generateMonthlyPdfReport(d.getFullYear(),d.getMonth()); }
}
function onEnterKey(e){
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(tag!=='input') return;
  const action=e.target.dataset.enterAction;
  if(!action) return;
  e.preventDefault();
  if(action==='submit-entry') submitErfassenForm();
  else if(action==='add-split') addSplit();
  else if(action==='add-booking-type') addBookingType();
  else if(action==='add-location') addLocation();
  else if(action==='add-custom-timer') addCustomTimerPreset();
  else if(action==='start-timer'){
    const t=document.getElementById('timer-type');
    const r=document.getElementById('timer-ref');
    if(t) startTimer(t.value, r?r.value:'');
  }
}
function onGlobalKeyDown(e){
  if(recordingShortcutId){ captureShortcutKey(e); return; }
  if(focusMode && e.key==='Escape'){ focusMode=false; renderApp(); return; }
  if(e.key==='Enter'){ onEnterKey(e); return; }
  if(MODIFIER_ONLY_KEYS.includes(e.key)) return;
  const hasModifier=e.ctrlKey||e.altKey||e.metaKey;
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(!hasModifier && (tag==='input'||tag==='select'||tag==='textarea')) return;
  const key=normalizeKey(e);
  const match=Object.entries(shortcuts).find(([,v])=>v.enabled && v.key===key);
  if(!match) return;
  e.preventDefault();
  runShortcut(match[0]);
}

function toDate(iso){return new Date(iso+'T00:00:00');}
function formatDateDE(iso){const d=toDate(iso);return `${String(d.getDate()).padStart(2,'0')}. ${String(d.getMonth()+1).padStart(2,'0')}. ${d.getFullYear()}`;}
function weekdayName(iso){return WEEKDAYS[(toDate(iso).getDay()+6)%7];}
function weekdayShort(iso){return WEEKDAYS_SHORT[(toDate(iso).getDay()+6)%7];}
function isoWeekInfo(iso){
  const d=toDate(iso);d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const week1=new Date(d.getFullYear(),0,4);
  const week=1+Math.round(((d-week1)/86400000-3+((week1.getDay()+6)%7))/7);
  return {year:d.getFullYear(),week};
}
function weekKeyOf(iso){const {year,week}=isoWeekInfo(iso);return `${year}-W${String(week).padStart(2,'0')}`;}
function mondayOfWeek(year,week){
  const simple=new Date(year,0,1+(week-1)*7);
  const dow=simple.getDay();
  const monday=new Date(simple);
  if(dow<=4) monday.setDate(simple.getDate()-dow+1); else monday.setDate(simple.getDate()+8-dow);
  return monday;
}
function weekRangeLabel(weekKey){
  const [y,w]=weekKey.split('-W').map(Number);
  const mon=mondayOfWeek(y,w);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const fmt=d=>`${String(d.getDate()).padStart(2,'0')}. ${String(d.getMonth()+1).padStart(2,'0')}.`;
  return `${fmt(mon)}–${fmt(sun)} ${y}`;
}
function shiftWeekKey(weekKey,delta){
  const [y,w]=weekKey.split('-W').map(Number);
  const mon=mondayOfWeek(y,w);mon.setDate(mon.getDate()+delta*7);
  const local=new Date(mon.getTime()-mon.getTimezoneOffset()*60000);
  return weekKeyOf(local.toISOString().slice(0,10));
}
function calcHours(arrival,departure,pauseMin){
  if(!arrival||!departure) return 0;
  const [ah,am]=arrival.split(':').map(Number);const [dh,dm]=departure.split(':').map(Number);
  let mins=(dh*60+dm)-(ah*60+am);if(mins<0) mins+=24*60;
  mins-=Number(pauseMin)||0;
  return Math.max(0,Math.round((mins/60)*100)/100);
}
function genId(){return 'e_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function entriesByWeek(){
  const map={};
  for(const e of entries){const wk=weekKeyOf(e.date);(map[wk]=map[wk]||[]).push(e);}

function getRangeBounds(range,refIso){
  const ref=toDate(refIso);
  if(range==='day') return {start:refIso,end:refIso};
  if(range==='week'){
    const wk=weekKeyOf(refIso);const [y,w]=wk.split('-W').map(Number);
    const mon=mondayOfWeek(y,w);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return {start:isoOf(mon),end:isoOf(sun)};
  }
  if(range==='month'){
    const y=ref.getFullYear(),m=ref.getMonth();
    return {start:isoOf(new Date(y,m,1)),end:isoOf(new Date(y,m+1,0))};
  }
  const y=ref.getFullYear();
  return {start:`${y}-01-01`,end:`${y}-12-31`};
}

function previousRangeBounds(range){
  const today=todayISO();
  if(range==='day'){ const d=toDate(today); d.setDate(d.getDate()-1); const iso=isoOf(d); return {start:iso,end:iso}; }
  if(range==='week'){
    const prevWk=shiftWeekKey(weekKeyOf(today),-1);
    const [y,w]=prevWk.split('-W').map(Number);
    const mon=mondayOfWeek(y,w);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return {start:isoOf(mon),end:isoOf(sun)};
  }
  if(range==='month'){
    const d=toDate(today);
    const prevM=new Date(d.getFullYear(),d.getMonth()-1,1);
    return {start:isoOf(prevM),end:isoOf(new Date(prevM.getFullYear(),prevM.getMonth()+1,0))};
  }
  const y=toDate(today).getFullYear()-1;
  return {start:`${y}-01-01`,end:`${y}-12-31`};
}

function parseTimeInput(raw){
  if(!raw) return null;
  let s=raw.trim().replace(/[.\s]/g,':').replace(/[^0-9:]/g,'');
  if(!s) return null;
  let h,m;
  if(s.includes(':')){
    const parts=s.split(':');
    h=parseInt(parts[0]||'0',10); m=parseInt(parts[1]||'0',10);
  }else if(s.length<=2){
    h=parseInt(s,10); m=0;
  }else{
    m=parseInt(s.slice(-2),10); h=parseInt(s.slice(0,-2)||'0',10);
  }
  if(isNaN(h)||isNaN(m)) return null;
  h=Math.max(0,Math.min(23,h)); m=Math.max(0,Math.min(59,m));
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

async function exportBackup(){
  const data=JSON.stringify({
    entries,

    if(ok){ showToast('"'+filename+'" wurde in "'+backupDirName+'" gespeichert.'); return; }
  }
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);

function importBackup(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const parsed=JSON.parse(e.target.result);
      const incoming=Array.isArray(parsed)?parsed:parsed.entries;
      if(!Array.isArray(incoming)) throw new Error('invalid');
      const hasExtras=!Array.isArray(parsed) && (Array.isArray(parsed.widgets)||Array.isArray(parsed.bookingTypes)||Array.isArray(parsed.locations)||Array.isArray(parsed.customTimers)||parsed.theme);
      const msg=hasExtras
        ? `${incoming.length} Einträge sowie Dashboard-Layout, Buchungstypen, Standorte, Custom-Timer und Theme aus dem Backup importieren? Bestehende Einträge mit gleichem Datum werden überschrieben, die übrigen Einstellungen vollständig ersetzt. (Export-Zielordner müssen danach erneut ausgewählt werden — das erlaubt der Browser aus Sicherheitsgründen nicht automatisch.)`
        : `${incoming.length} Einträge aus dem Backup importieren? Bestehende Einträge mit gleichem Datum werden überschrieben.`;
      if(!confirm(msg)) return;
      const byDate={};
      entries.forEach(en=>{byDate[en.date]=en;});
      incoming.forEach(en=>{if(en && en.date) byDate[en.date]=en;});
      entries=Object.values(byDate);
      save();
      if(!Array.isArray(parsed)){
        if(Array.isArray(parsed.widgets) && parsed.widgets.length){ widgets=parsed.widgets; saveWidgets(); }
        if(Array.isArray(parsed.bookingTypes) && parsed.bookingTypes.length){ BOOKING_TYPES=parsed.bookingTypes; saveBookingTypes(); }
        if(Array.isArray(parsed.locations) && parsed.locations.length){ LOCATIONS_DATA=parsed.locations; saveLocations(); }
        if(Array.isArray(parsed.customTimers)){ customTimerPresets=parsed.customTimers; saveCustomTimers(); }
        if(parsed.theme==='dark'||parsed.theme==='light'){
          theme=parsed.theme;
          try{ localStorage.setItem('zb-theme',theme); }catch(err){}
          document.documentElement.setAttribute('data-theme',theme);
        }
        if(parsed.money && typeof parsed.money==='object'){
          moneyTrackingEnabled=!!parsed.money.enabled;
          hourlyWage=Number(parsed.money.wage)||0;
          saveMoneySettings();
        }
        if(parsed.shortcuts && typeof parsed.shortcuts==='object'){
          shortcuts=parsed.shortcuts;
          saveShortcuts();
        }
        if(Array.isArray(parsed.reminders)){
          reminders=parsed.reminders;
          saveReminders();
        }
      }
      renderApp();
      alert('Backup importiert.');
    }catch(err){
      alert('Diese Datei konnte nicht gelesen werden. Bitte eine gültige Backup-Datei wählen.');
    }
  };
  reader.readAsText(file);
}

  }));
  const total=Math.round(list.reduce((s,e)=>s+e.hours,0)*100)/100;
  rows.push({Datum:'',Wochentag:'',Standort:'',Kommen:'',Gehen:'','Mittag (Min)':'Total',Arbeitszeit:total,Aufteilung:'',Bemerkung:''});
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:12},{wch:16},{wch:8},{wch:8},{wch:10},{wch:11},{wch:36},{wch:30}];
  const wb=XLSX.utils.book_new();
  const [y,w]=weekKey.split('-W');
  XLSX.utils.book_append_sheet(wb,ws,`KW${w}`);
  const filename=`Arbeitszeit_KW${w}_${y}.xlsx`;
  if(exportDirHandle){
    const ok=await writeWorkbookToExportDir(wb,filename);
    if(ok){ showToast('"'+filename+'" wurde in "'+exportDirName+'" gespeichert.'); return; }

function isLastDayOfMonth(iso){
  const d=toDate(iso);
  const next=new Date(d);next.setDate(d.getDate()+1);
  return next.getMonth()!==d.getMonth();
}
async function generateMonthlyPdfReport(year,month){
  if(typeof window.jspdf==='undefined'){ showToast('Die PDF-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.'); return; }
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const monthStart=isoOf(new Date(year,month,1));
  const monthEnd=isoOf(new Date(year,month+1,0));
  const list=entries.filter(e=>e.date>=monthStart&&e.date<=monthEnd).sort((a,b)=>a.date.localeCompare(b.date));
  const totalHours=round2(list.reduce((s,e)=>s+e.hours,0));
  const workDays=list.length;
  const avg=workDays?round2(totalHours/workDays):0;
  const absence=absenceDaysCount(list);
  const byLoc=aggregateByLocation(list);
  const topLocText=byLoc.length?byLoc.map(l=>`${l.name} (${l.hours} h)`).join(', '):'–';

  doc.setFillColor(59,91,219);
  doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255);
  doc.setFont(undefined,'bold');
  doc.setFontSize(20);
  doc.text('Monatsbericht',14,16);
  doc.setFont(undefined,'normal');
  doc.setFontSize(11);
  doc.text(`${MONTHS_FULL[month]} ${year}`,14,24);
  doc.setFontSize(8.5);
  doc.text(`Erstellt am ${formatDateDE(todayISO())}`,196,24,{align:'right'});

  doc.setTextColor(20,22,26);
  const stats=[
    {label:'Arbeitszeit gesamt',value:totalHours+' h'},
    {label:'Erfasste Tage',value:String(workDays)},
    {label:'Ø Std. / Tag',value:avg+' h'},
    {label:'Abwesenheitstage',value:String(absence)}
  ];
  const boxW=44,boxGap=3.3,boxY=38,boxH=22;
  stats.forEach((s,i)=>{
    const x=14+i*(boxW+boxGap);
    doc.setDrawColor(225,227,233);
    doc.setFillColor(246,247,249);
    doc.roundedRect(x,boxY,boxW,boxH,2,2,'FD');
    doc.setFontSize(7.5);
    doc.setTextColor(115,120,130);
    doc.text(s.label,x+3.5,boxY+8,{maxWidth:boxW-7});
    doc.setFontSize(14);
    doc.setFont(undefined,'bold');
    doc.setTextColor(20,22,26);
    doc.text(s.value,x+3.5,boxY+17);
    doc.setFont(undefined,'normal');
  });

  doc.setFontSize(8.5);
  doc.setTextColor(100,105,115);
  doc.text(`Standorte: ${topLocText}`,14,boxY+boxH+8,{maxWidth:182});

  const rows=list.map(e=>[
    formatDateDE(e.date),weekdayShort(e.date),e.location,`${e.arrival}–${e.departure}`,
    `${e.pause}'`,`${e.hours} h`,
    e.splits.map(s=>`${s.type}${s.ref?' ('+s.ref+')':''} ${s.hours}h`).join(', ')||'–'
  ]);
  doc.autoTable({
    startY:boxY+boxH+14,
    head:[['Datum','Tag','Standort','Zeit','Pause','Std.','Aufteilung']],
    body:rows,
    theme:'striped',
    headStyles:{fillColor:[59,91,219],textColor:255,fontStyle:'bold',fontSize:8.5},
    styles:{fontSize:8,cellPadding:2.6,textColor:[40,42,48]},
    alternateRowStyles:{fillColor:[246,247,249]},
    columnStyles:{0:{cellWidth:22},1:{cellWidth:10},2:{cellWidth:26},3:{cellWidth:24},4:{cellWidth:14},5:{cellWidth:14},6:{cellWidth:'auto'}},
    margin:{left:14,right:14},
    didDrawPage:()=>{
      const page=doc.internal.getCurrentPageInfo().pageNumber;
      doc.setFontSize(8);
      doc.setTextColor(160,163,170);
      doc.text(`Seite ${page}`,196,289,{align:'right'});
      doc.text('Zeiterfassung — automatisch generierter Monatsbericht',14,289);
    }
  });

  if(!list.length){
    doc.setFontSize(10);
    doc.setTextColor(150,150,150);
    doc.text('Keine Einträge in diesem Monat.',14,boxY+boxH+22);
  }

  const filename=`Monatsbericht_${MONTHS_FULL[month]}_${year}.pdf`;
  const pdfBlob=doc.output('blob');
  if(pdfDirHandle){
    const ok=await writeBlobToPdfDir(pdfBlob,filename);
    if(ok){ showToast('"'+filename+'" wurde in "'+pdfDirName+'" gespeichert.'); return; }
  }
  const url=URL.createObjectURL(pdfBlob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function addWidgetFromCatalog(idx){
  const c=WIDGET_CATALOG[idx];if(!c) return;
  const settings={};
  if(c.type==='kpi'){ settings.metric=c.metric; if(!['streak','nextFriday'].includes(c.metric)) settings.range='week'; }
  else if(c.type==='goal-gauge'){ settings.range='week'; settings.target=42.5; }
  else if(c.type==='overtime-balance'){ settings.targetPerDay=8.4; settings.startingBalance=0; }
  else if(c.type==='heatmap'){ settings.weeks=18; }
  else if(c.type==='recent-table'){ settings.count=c.defaultSize==='s'?5:c.defaultSize==='l'?15:8; }
  else if(c.type==='year-progress'){ settings.yearlyTarget=2200; }
  else if(c.type==='type-trend'){ settings.range='week'; settings.filterType=typeNames()[0]||''; }
  else if(c.type==='location-trend'){ settings.range='week'; settings.filterLocation=locationNames()[0]||''; }
  else{ settings.range=defaultRangeFor(c.type); }
  widgets.push({id:genId(),type:c.type,size:c.defaultSize,settings});
  saveWidgets();renderApp();
}
function setWidgetSetting(widgetId,key,value){
  const w=widgets.find(x=>x.id===widgetId);if(!w) return;
  w.settings[key]=value;
  saveWidgets();renderApp();
}

const KPI_TREND_METRICS=new Set(['total','avg','days','absence','weekendCount']);
function computeKpiMetric(metric,range){
  const list=entriesInRange(range);
  const totalRange=round2(list.reduce((s,e)=>s+e.hours,0));
  const daysRange=list.length;
  let value='–',color='var(--accent)',lines=[];
  switch(metric){
    case 'total':
      value=totalRange+' h';color='var(--accent)';
      lines=[rangeLabelText(range),'Ø '+(daysRange?round2(totalRange/daysRange):0)+' h/Tag bei '+daysRange+' Tagen'];
      break;
    case 'avg':{
      const avg=daysRange?round2(totalRange/daysRange):0;
      value=avg+' h';color='var(--warning)';
      lines=[daysRange+' Tage erfasst','Total: '+totalRange+' h'];
      break;
    }
    case 'days':
      value=String(daysRange);color='var(--success)';
      lines=[rangeLabelText(range),'Ø '+(daysRange?round2(totalRange/daysRange):0)+' h/Tag'];
      break;
    case 'topLocation':{
      const byLoc=aggregateByLocation(list);const top=byLoc[0];
      value=top?esc(top.name):'–';color='#7C5CFC';
      const pct=top&&totalRange>0?Math.round(top.hours/totalRange*100):0;
      lines=[top?top.hours+' h':'Keine Daten',top?pct+'% der Gesamtzeit':''];
      break;
    }
    case 'topType':{
      const byType=aggregateByType(list);const top=byType[0];
      const totalSplit=round2(byType.reduce((s,d)=>s+d.hours,0));
      value=top?esc(top.name):'–';color='#0EA5A5';
      const pct=top&&totalSplit>0?Math.round(top.hours/totalSplit*100):0;
      lines=[top?top.hours+' h':'Keine Daten',top?pct+'% der aufgeteilten Zeit':''];
      break;
    }
    case 'longest':{
      const l=longestDay(list);
      const avg=daysRange?round2(totalRange/daysRange):0;
      value=l?l.hours+' h':'–';color='#F97316';
      lines=[l?formatDateDE(l.date):'Keine Daten',l?'+'+round2(l.hours-avg)+' h ggü. Ø':''];
      break;
    }
    case 'absence':{
      const n=absenceDaysCount(list);
      const pct=daysRange?Math.round(n/daysRange*100):0;
      value=String(n);color='#64748B';
      lines=['Ferien/Krank/Militär/Kompens',daysRange?pct+'% der erfassten Tage':''];
      break;
    }
    case 'avgWindow':
      value=avgWindow(list)||'–';color='#0284C7';
      lines=[rangeLabelText(range),daysRange+' Tage berücksichtigt'];
      break;
    case 'streak':
      value=currentStreak()+' Tage';color='#EAB308';
      lines=['in Folge erfasst 🔥',longestStreakEver()+' Tage Rekord'];
      break;
    case 'delta':{
      const prevList=entriesInPreviousRange(range);
      const prevTotal=round2(prevList.reduce((s,e)=>s+e.hours,0));
      const delta=round2(totalRange-prevTotal);
      const pct=prevTotal>0?Math.round((delta/prevTotal)*100):(totalRange>0?100:0);
      const up=delta>=0;
      value=(up?'+':'')+delta+' h';color=up?'var(--success)':'var(--danger)';
      lines=[(up?'▲':'▼')+' '+Math.abs(pct)+'% ggü. Vorperiode','Vorperiode: '+prevTotal+' h'];
      break;
    }
    case 'avgPause':{
      const avgP=avgPauseMin(list);
      value=avgP!=null?avgP+' Min.':'–';color='#8B5CF6';
      lines=[daysRange+' Tage berücksichtigt'];
      break;
    }
    case 'longestPause':{
      const d=extremePauseDay(list,'max');
      value=d?d.pause+' Min.':'–';color='#8B5CF6';
      lines=[d?formatDateDE(d.date):'Keine Daten',d?esc(d.location):''];
      break;
    }
    case 'shortestPause':{
      const d=extremePauseDay(list,'min');
      value=d?d.pause+' Min.':'–';color='#8B5CF6';
      lines=[d?formatDateDE(d.date):'Keine Daten',d?esc(d.location):''];
      break;
    }
    case 'incompleteDays':{
      const n=incompleteDaysCount(list);
      value=String(n);color=n>0?'var(--warning)':'var(--success)';
      lines=['von '+daysRange+' Tagen im Zeitraum','Aufteilung ≠ Gesamtzeit'];
      break;
    }
    case 'typeDiversity':
      value=String(distinctTypesUsed(list));color='#0EA5A5';
      lines=['unterschiedliche Buchungstypen',rangeLabelText(range)];
      break;
    case 'timerShare':{
      const st=timerSplitStats(list);
      const pct=st.totalSplitHours>0?Math.round(st.timerHours/st.totalSplitHours*100):0;
      value=pct+' %';color='var(--accent)';
      lines=[st.timerHours+' von '+st.totalSplitHours+' h via Timer',st.timerSessions+' Timer-Buchungen'];
      break;
    }
    case 'timerSessions':{
      const st=timerSplitStats(list);
      value=String(st.timerSessions);color='var(--accent)';
      lines=[st.timerHours+' h über den Timer gebucht',rangeLabelText(range)];
      break;
    }
    case 'weekendCount':
      value=String(weekendEntriesCount(list));color='#DB2777';
      lines=['Einträge an Sa/So',rangeLabelText(range)];
      break;
    case 'earliestLatest':{
      const e1=earliestArrival(list),e2=latestDeparture(list);
      value=e1?e1.arrival:'–';color='#0284C7';
      lines=[e1?'Frühester Start: '+formatDateDE(e1.date):'Keine Daten',e2?'Spätestes Ende: '+e2.departure+' ('+formatDateDE(e2.date)+')':''];
      break;
    }
    case 'coverageRatio':{
      const cov=workdayCoverage(range);
      const pct=cov.totalWeekdays?Math.round(cov.coveredWeekdays/cov.totalWeekdays*100):0;
      value=pct+' %';color=pct>=80?'var(--success)':pct>=50?'var(--warning)':'var(--danger)';
      lines=[cov.coveredWeekdays+' von '+cov.totalWeekdays+' Werktagen',rangeLabelText(range)];
      break;
    }
    case 'nextFriday':{
      const d=daysUntilNextFriday();
      value=(d===0?'Heute':d+' Tage');color='var(--accent)';
      lines=['bis zum nächsten Wochenexport','Jeden Freitag automatisch'];
      break;
    }
    case 'activeWeek':{
      const ex=weekExtremesInRange(range);
      value=ex?ex.max.hours+' h':'–';color='var(--success)';
      lines=[ex?'stärkste Woche: '+ex.max.wk:'Keine Daten',ex?'schwächste: '+ex.min.wk+' ('+ex.min.hours+' h)':''];
      break;
    }
    case 'quietWeek':{
      const ex=weekExtremesInRange(range);
      value=ex?ex.min.hours+' h':'–';color='var(--text-muted)';
      lines=[ex?'schwächste Woche: '+ex.min.wk:'Keine Daten',ex?'stärkste: '+ex.max.wk+' ('+ex.max.hours+' h)':''];

function renderGaugeSvg(pct,color){

function renderGoalGaugeBody(instance){
  const range=instance.settings.range||'week';

  const list=entriesInRange(range);
  const total=round2(list.reduce((s,e)=>s+e.hours,0));
  const pct=target>0?Math.round((total/target)*100):0;
  let color='var(--danger)';
  if(pct>=110) color='#7C5CFC'; else if(pct>=90) color='var(--success)'; else if(pct>=50) color='var(--warning)';

  }
  const foot = total>=target ? `+${Math.abs(remain)} h Überstunden 🎉` : `${remain} h bis Ziel`;

  startMonday.setDate(startMonday.getDate()-(weeksCount-1)*7);

function moveWidget(widgetId,dir){
  const idx=widgets.findIndex(w=>w.id===widgetId);if(idx<0) return;
  const newIdx=idx+dir;if(newIdx<0||newIdx>=widgets.length) return;
  const [item]=widgets.splice(idx,1);

  saveWidgets();renderApp();
}

function reorderSettingsList(listName,fromIdx,toIdx){
  let arr,saveFn;
  if(listName==='bookingTypes'){ arr=BOOKING_TYPES; saveFn=saveBookingTypes; }
  else if(listName==='locations'){ arr=LOCATIONS_DATA; saveFn=saveLocations; }
  else if(listName==='customTimers'){ arr=customTimerPresets; saveFn=saveCustomTimers; }
  else return;
  if(fromIdx<0||toIdx<0||fromIdx>=arr.length||toIdx>=arr.length||fromIdx===toIdx) return;
  const [item]=arr.splice(fromIdx,1);
  arr.splice(toIdx,0,item);
  saveFn();
  renderApp();
}
function onSettingsDragStart(e){
  const handle=e.target.closest('[data-drag-handle]');
  if(!handle) return;
  const row=handle.closest('[data-drag-row]');
  if(!row) return;
  settingsDragState={list:row.dataset.dragList,idx:Number(row.dataset.dragIdx)};
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','drag');}catch(err){}
}
function onSettingsDragOver(e){
  if(!settingsDragState) return;
  const row=e.target.closest('[data-drag-row]');
  if(!row || row.dataset.dragList!==settingsDragState.list) return;
  e.preventDefault();
}
function onSettingsDrop(e){
  if(!settingsDragState) return;
  const row=e.target.closest('[data-drag-row]');
  if(row && row.dataset.dragList===settingsDragState.list){
    e.preventDefault();
    reorderSettingsList(settingsDragState.list,settingsDragState.idx,Number(row.dataset.dragIdx));
  }
  settingsDragState=null;
}

function renderDonut(data,colorMap,size,thickness){
  size=size||150;thickness=thickness||20;
  const total=data.reduce((s,d)=>s+d.hours,0);
  const r=(size-thickness)/2, c=2*Math.PI*r, cx=size/2, cy=size/2;
  let offset=0;
  const segments=data.map(d=>{
    const frac=total>0?d.hours/total:0;
    const len=Math.max(frac*c-1.5,0);
    const seg=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorMap[d.name]||'#64748B'}" stroke-width="${thickness}" stroke-linecap="round" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=frac*c;
    return seg;
  }).join('');
  return `<div class="zb-donut" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(--donut-track)" stroke-width="${thickness}"/>
      ${segments}
    </svg>
    <div class="zb-donut-center"><div class="zb-donut-total">${Math.round(total*10)/10}</div><div class="zb-donut-unit">Std.</div></div>

function round2(n){ return Math.round(n*100)/100; }
function periodBuckets(range,windowSize){
  if(range==='day'){
    const n=windowSize||14;
    const endD=toDate(todayISO());
    const startD=new Date(endD);startD.setDate(startD.getDate()-(n-1));
    const buckets=[];
    for(let d=new Date(startD);d<=endD;d.setDate(d.getDate()+1)){
      const iso=isoOf(d);
      buckets.push({label:weekdayShort(iso),start:iso,end:iso});
    }
    return buckets;
  }
  if(range==='month'){
    const {start,end}=getRangeBounds('month',todayISO());
    const startD=toDate(start),endD=toDate(end);
    const buckets=[];
    for(let d=new Date(startD);d<=endD;d.setDate(d.getDate()+1)){
      const iso=isoOf(d);
      buckets.push({label:String(toDate(iso).getDate()),start:iso,end:iso});
    }
    return buckets;
  }
  if(range==='year'){
    const y=toDate(todayISO()).getFullYear();
    const buckets=[];
    for(let m=0;m<12;m++){
      const start=isoOf(new Date(y,m,1)), end=isoOf(new Date(y,m+1,0));
      buckets.push({label:MONTHS_FULL[m].slice(0,3),start,end});
    }
    return buckets;
  }
  const n=windowSize||8;
  const curWk=weekKeyOf(todayISO());
  const buckets=[];
  for(let i=n-1;i>=0;i--){
    const wk=shiftWeekKey(curWk,-i);
    const [y,w]=wk.split('-W').map(Number);
    const mon=mondayOfWeek(y,w);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    buckets.push({label:'KW'+w,start:isoOf(mon),end:isoOf(sun)});
  }
  return buckets;
}
function sumHoursInBucket(start,end){
  return entries.filter(e=>e.date>=start&&e.date<=end).reduce((s,e)=>s+e.hours,0);
}
function sumSplitHoursInBucket(start,end,predicate){
  let sum=0;
  entries.filter(e=>e.date>=start&&e.date<=end).forEach(e=>{e.splits.forEach(s=>{if(predicate(s)) sum+=s.hours;});});
  return sum;
}
function sumEntryHoursInBucket(start,end,predicate){
  return entries.filter(e=>e.date>=start&&e.date<=end&&predicate(e)).reduce((s,e)=>s+e.hours,0);
}
function trendWindowSize(range,size){
  if(range==='day') return size==='s'?7:size==='l'?21:14;
  if(range==='week') return size==='s'?4:size==='l'?12:8;
  return null;
}
function trendForRange(range,size){
  size=size||'m';
  const windowSize=trendWindowSize(range,size);
  const buckets=periodBuckets(range,windowSize);
  const titleMap={day:'Tagestrend',week:'Wochentrend',month:'Tagestrend (aktueller Monat)',year:'Jahrestrend'};
  return {title:titleMap[range],data:buckets.map(b=>({label:b.label,hours:round2(sumHoursInBucket(b.start,b.end))}))};
}
const TREND_CHART_PX={s:70,m:120,l:170};
function renderTrendBars(data,size){
  size=size||'m';
  if(!data.length) return `<div class="zb-chart-empty">Keine Daten.</div>`;
  const chartPx=TREND_CHART_PX[size]||120;
  const max=Math.max(1,...data.map(t=>t.hours));
  return `<div class="zb-trend-bars" style="height:${chartPx}px">${data.map(t=>`
    <div class="zb-trend-col">
      <div class="zb-trend-val num">${t.hours}</div>
      <div class="zb-trend-bar" style="height:${Math.max(4,Math.round((t.hours/max)*chartPx))}px"></div>
      <div class="zb-trend-label">${t.label}</div>
    </div>`).join('')}</div>`;
}
